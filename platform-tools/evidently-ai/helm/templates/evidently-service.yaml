apiVersion: v1
kind: Service
metadata:
  name: {{ include "evidently.uiName" . }}
  namespace: {{ include "evidently.namespace" . }}
  labels:
    {{- include "evidently.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.evidently.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - port: {{ .Values.evidently.service.port }}
      targetPort: http
      {{- if and (eq .Values.evidently.service.type "NodePort") .Values.evidently.service.nodePort }}
      nodePort: {{ .Values.evidently.service.nodePort }}
      {{- end }}
      protocol: TCP
      name: http
