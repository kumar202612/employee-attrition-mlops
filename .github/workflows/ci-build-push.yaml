name: CI - Employee Attrition (Build & Push)
on:
  push:
    branches: [main]
    paths:
      - 'phase-1-local-dev/**'
  workflow_dispatch:
env:
  PROJECT_ID: mlops-vertex-ai-tsk1
  REGION: us-east1
  ARTIFACT_REPO: employee-attrition-repo
  IMAGE_NAME: employee-attrition-inference
  WORKDIR: phase-1-local-dev
  WORKLOAD_IDENTITY_PROVIDER: projects/737883058208/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: employee-attrition-deployer@mlops-vertex-ai-tsk1.iam.gserviceaccount.com
permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation
jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run data preparation
        env:
          PYTHONPATH: src
        run: |
          python src/data_preparation/01_ingestion.py
          python src/data_preparation/02_validation.py
          python src/data_preparation/03_eda.py
          python src/data_preparation/04_cleaning.py
          python src/data_preparation/05_feature_engg.py
          python src/data_preparation/06_preprocessing.py
      - name: Run training script
        env:
          PYTHONPATH: src
        run: python src/model_training/01_training.py
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: ${{ env.WORKDIR }}/artifacts/model.pkl
  build-and-push:
    runs-on: ubuntu-latest
    needs: train
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ${{ env.WORKDIR }}/artifacts/
      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build image
        run: |
          docker build -f inference/dockerfile -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Push image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Also tag as latest
        run: |
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest
