name: CI - Employee Attrition (Build & Push)
on:
  push:
    branches: [main]
    paths:
      - 'phase-1-local-dev/**'
  workflow_dispatch:
env:
  PROJECT_ID: mlops-vertex-ai-tsk1
  REGION: us-east1
  ARTIFACT_REPO: employee-attrition-repo
  IMAGE_NAME: employee-attrition-inference
  WORKDIR: phase-1-local-dev
  WORKLOAD_IDENTITY_PROVIDER: projects/737883058208/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: employee-attrition-deployer@mlops-vertex-ai-tsk1.iam.gserviceaccount.com
permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation
jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run data preparation
        env:
          PYTHONPATH: src
        run: |
          python src/data_preparation/01_ingestion.py
          python src/data_preparation/02_validation.py
          python src/data_preparation/03_eda.py
          python src/data_preparation/04_cleaning.py
          python src/data_preparation/05_feature_engg.py
          python src/data_preparation/06_preprocessing.py
      - name: Run training script
        env:
          PYTHONPATH: src
        run: python src/model_training/01_training.py
      - name: Run cross-validation across candidate algorithms
        env:
          PYTHONPATH: src
        run: python src/model_training/03_cross_validation.py
      - name: Tune - select and refit best algorithm
        env:
          PYTHONPATH: src
        run: python src/model_training/04_tuning.py
      - name: Evaluate final chosen model
        env:
          PYTHONPATH: src
        run: python src/model_training/02_evaluation.py
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: ${{ env.WORKDIR }}/artifacts/model.pkl
      - name: Upload metrics and CV comparison
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: |
            ${{ env.WORKDIR }}/artifacts/metrics.json
            ${{ env.WORKDIR }}/artifacts/cv_results.json
            ${{ env.WORKDIR }}/artifacts/feature_importance.png

  test:
    runs-on: ubuntu-latest
    needs: train
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ${{ env.WORKDIR }}/artifacts/
      - name: Run smoke test on trained model
        env:
          PYTHONPATH: src
        run: |
          python -c "
          from src.model_testing.predict import test

          years_at_company = 5.0
          company_tenure = 8.0
          job_level = 2

          sample = {
              'Years at Company': years_at_company,
              'Performance Rating': 3.0,
              'Number of Promotions': 1,
              'Overtime': 0,
              'Education Level': 2,
              'Number of Dependents': 2,
              'Job Level': job_level,
              'Company Size': 2,
              'Company Tenure': company_tenure,
              'Remote Work': 1,
              'Company Reputation': 3.0,
              'OverallSatisfaction': 3.0,
              'Opportunities': 2.0,
              'AnnualIncome': 2,
              'AgeGroup': 3,
              'RoleStagnationRatio': round(years_at_company / (company_tenure + 1), 3),
              'TenureGap': round(company_tenure - years_at_company, 2),
              'EarlyCompanyTenureRisk': 1 if years_at_company <= 2 else 0,
              'LongTenureLowRoleRisk': 1 if (company_tenure > 5 and job_level <= 2) else 0,
          }

          result = test(sample)
          assert result is not None, 'test() returned None — model load or prediction likely failed'
          probability, prediction = result
          assert prediction in (0, 1), f'Unexpected prediction value: {prediction}'
          print('✅ Smoke test passed')
          "

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ${{ env.WORKDIR }}/artifacts/
      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build image
        run: |
          docker build -f inference/Dockerfile -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Push image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Also tag as latest
        run: |
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest
