apiVersion: apps/v1
kind: Deployment
metadata:
  name: attrition-api
  labels:
    app: attrition-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attrition-api
  template:
    metadata:
      labels:
        app: attrition-api
    spec:
      containers:
        - name: attrition-api
          image: us-east1-docker.pkg.dev/mlops-vertex-ai-tsk1/employee-attrition-repo/employee-attrition-inference:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: attrition-api
spec:
  selector:
    app: attrition-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
